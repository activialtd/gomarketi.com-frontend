name: Deploy vendor-web

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/vendor-web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vendor-web
        run: pnpm --filter vendor-web build
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref_name == 'main' && 'https://api.wojalo.com' || 'https://api-staging.wojalo.com' }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_VENDOR_WEB }}
          working-directory: apps/vendor-web
          vercel-args: ${{ github.ref_name == 'main' && '--prod' || '' }}
